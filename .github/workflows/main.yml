
name: ACEest Fitness CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Lint and Docker Tests
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Get source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Configure Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stage 3: Install linting tool
      - name: Install Linting Tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      # Stage 4: Validate source code
      - name: Python Syntax Validation
        run: |
          python -m compileall -q app.py tests

      # Stage 5: Lint source code
      - name: Run Ruff Linter
        run: |
          ruff check app.py tests --select E4,E7,E9,F

      # Stage 6: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t aceest-fitness:ci .

      # Stage 7: Run tests inside Docker
      - name: Run Pytest in Docker
        run: |
          docker run --rm --entrypoint python \
            aceest-fitness:ci \
            -m pytest -v -p no:cacheprovider

      # Stage 8: Confirm successful build
      - name: Build Completion
        run: |
          echo "ACEest Fitness CI/CD Pipeline Successful!"
